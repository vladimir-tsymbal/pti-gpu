---

# Build-only check of the aggregate top-level CMake project on a GitHub-hosted
# runner (no GPU, no oneAPI). Components that need oneAPI (icpx), MDAPI,
# GTPin or IGA are skipped.

name: ci

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-lin:
    name: Build tools and samples (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        env:
          # Ubuntu's own libze-dev (1.16) lacks zeInitDrivers, so use the
          # Level Zero loader release (same version as build_utils/get_ze_headers.py).
          LEVEL_ZERO_VERSION: "1.29.0"
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build opencl-headers \
            ocl-icd-opencl-dev libdrm-dev python3
          url="https://github.com/oneapi-src/level-zero/releases/download/v${LEVEL_ZERO_VERSION}"
          for pkg in libze1 libze-dev; do
            curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${pkg}.deb" \
              "${url}/${pkg}_${LEVEL_ZERO_VERSION}+u24.04_amd64.deb"
          done
          sudo apt-get install -y "${RUNNER_TEMP}/libze1.deb" "${RUNNER_TEMP}/libze-dev.deb"

      - name: Configure
        run: |
          # instcount and memaccess need GTPin. MDAPI is only needed at run
          # time (its headers are downloaded). icpx and IGA samples are
          # skipped automatically when the compiler or library is not found.
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            "-DPTI_GPU_SKIP=instcount;memaccess"

      - name: Build
        run: cmake --build build

      - name: Install
        run: cmake --install build --prefix "${{ runner.temp }}/pti-install"
