---

# Build-only checks on GitHub-hosted runners (no GPU, so no tests run here):
# - build-lin: the aggregate top-level CMake project with GCC on Ubuntu 24.04
#   and 26.04. Components that need oneAPI (icpx), GTPin or IGA are skipped.
# - build-icpx: the same build with the oneAPI DPC++/C++ compiler installed,
#   so the icpx samples (dpc_gemm, dpc_info, omp_gemm, omp_hot_regions) are
#   built as well.
# - docs: relative links in the Markdown files.

name: ci

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  # Ubuntu 24.04's own libze-dev (1.16) lacks zeInitDrivers, so 24.04 uses the
  # Level Zero loader release (same version as build_utils/get_ze_headers.py).
  # Ubuntu 26.04's libze-dev (1.28) has it; there are no 26.04 release debs.
  LEVEL_ZERO_VERSION: "1.29.0"
  # oneAPI DPC++/C++ compiler package from the Intel oneAPI apt repository.
  ONEAPI_COMPILER_PACKAGE: intel-oneapi-compiler-dpcpp-cpp-2026.2

jobs:
  build-lin:
    name: Build tools and samples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build opencl-headers \
            ocl-icd-opencl-dev libdrm-dev python3
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then
            url="https://github.com/oneapi-src/level-zero/releases/download/v${LEVEL_ZERO_VERSION}"
            for pkg in libze1 libze-dev; do
              curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${pkg}.deb" \
                "${url}/${pkg}_${LEVEL_ZERO_VERSION}+u24.04_amd64.deb"
            done
            sudo apt-get install -y "${RUNNER_TEMP}/libze1.deb" "${RUNNER_TEMP}/libze-dev.deb"
          else
            sudo apt-get install -y libze-dev
          fi
          dpkg-query -W libze-dev

      - name: Configure
        run: |
          # instcount and memaccess need GTPin. MDAPI is only needed at run
          # time (its headers are downloaded). icpx and IGA samples are
          # skipped automatically when the compiler or library is not found.
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            "-DPTI_GPU_SKIP=instcount;memaccess"

      - name: Build
        run: cmake --build build

      - name: Install
        run: cmake --install build --prefix "${{ runner.temp }}/pti-install"

  build-icpx:
    name: Build with the oneAPI DPC++/C++ compiler (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build opencl-headers \
            ocl-icd-opencl-dev libdrm-dev python3 gpg
          url="https://github.com/oneapi-src/level-zero/releases/download/v${LEVEL_ZERO_VERSION}"
          for pkg in libze1 libze-dev; do
            curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${pkg}.deb" \
              "${url}/${pkg}_${LEVEL_ZERO_VERSION}+u24.04_amd64.deb"
          done
          sudo apt-get install -y "${RUNNER_TEMP}/libze1.deb" "${RUNNER_TEMP}/libze-dev.deb"
          # Intel oneAPI apt repository (https://apt.repos.intel.com/oneapi).
          curl -fsSL --retry 3 \
            https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${ONEAPI_COMPILER_PACKAGE}"

      - name: Configure
        run: |
          source /opt/intel/oneapi/setvars.sh
          icpx --version | head -1
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release \
            "-DPTI_GPU_SKIP=instcount;memaccess" 2>&1 | tee configure.log
          # Fail if CMake did not find icpx (the icpx samples would be skipped).
          if grep -q "icpx not found" configure.log; then
            echo "::error::icpx samples were skipped"
            exit 1
          fi

      - name: Build
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --build build
          for f in dpc_gemm/dpc_gemm dpc_info/dpc_info omp_gemm/omp_gemm \
                   omp_hot_regions/libomp_hot_regions.so; do
            test -f "build/samples/${f}" \
              || { echo "::error::build/samples/${f} was not built"; exit 1; }
          done

      - name: Install
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --install build --prefix "${{ runner.temp }}/pti-install"

  docs:
    name: Check Markdown relative links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check links
        run: python3 build_utils/check_md_links.py
